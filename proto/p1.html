<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>document.documentElement.className += ' js';</script>
<title>P1 · Hímzett embléma</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<style>
.nav .btn{padding:.7rem 1.5rem;font-size:.78rem;margin-left:.6rem}
.hero-b{position:relative;min-height:100svh;background:var(--paper);overflow:hidden;display:grid;align-content:end;justify-items:center;padding-bottom:9vh;text-align:center}
.stitch-canvas{position:absolute;left:0;top:0;width:100%;height:100%;z-index:1}
.hero-b__fallback{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);width:min(62vw,980px);opacity:.9;z-index:0}
.hero-b.stitch-on .hero-b__fallback{opacity:0}
.hero-b__mark{position:relative;z-index:2;font-family:var(--font-ui);font-weight:500;letter-spacing:.42em;text-transform:uppercase;font-size:clamp(.95rem,1.6vw,1.35rem);color:var(--navy)}
.hero-b__mark small{display:block;letter-spacing:.34em;font-size:.6em;color:var(--muted);margin-top:.5rem}
.hero-b__line{position:relative;z-index:2;margin-top:1.6rem;font-family:var(--font-display);font-style:italic;font-size:clamp(1.5rem,2.8vw,2.3rem);color:var(--copper-deep)}
.after{position:relative;height:70vh;overflow:hidden}
.after img{width:100%;height:100%;object-fit:cover}
.after h2{position:absolute;left:var(--pad);bottom:9vh;color:#F2EEE1;font-size:var(--step-4);max-width:12ch;line-height:1.02;z-index:2}
.after::after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,rgba(34,41,63,.7),transparent 60%)}
</style>
</head>
<body>
<nav class="nav">
  <a href="#" class="nav__brand"><img src="../media/lotusz-emblema.png" alt=""><span class="nav__brand-text"><span class="nav__brand-name">Marie Creation</span><span class="nav__brand-sub">Interior Design</span></span></a>
  <div class="nav__links"><a class="nav__link" href="#">Függöny és textil</a><a class="nav__link" href="#">Bútortervezés</a><a class="nav__link" href="#">Lakberendezés</a><a class="nav__link" href="#">Webshop</a><a class="nav__link" href="#">Rólam</a><a class="btn btn--copper" href="#">Időpontkérés</a></div>
</nav>
<header class="hero-b" data-stitch-img>
  <img class="hero-b__fallback" src="../media/lotusz-emblema.png" alt="">
  <div class="hero-b__mark">Marie Creation<small>Interior Design · Textil · Varroda</small></div>
  <p class="hero-b__line">az otthon minden szála</p>
</header>
<section class="after"><img src="../media/stock/hero-feny.jpg" alt=""><h2>Ahol a fény átjárja a szövetet</h2></section>
<script src="../js/lotus-data.js"></script>
<script>window.__mcReduce = matchMedia('(prefers-reduced-motion:reduce)').matches && !/motion=1/.test(location.search);</script>
<script src="../js/stitch-img.js"></script>
</body>
</html>
